<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beebeelex Sea Chart Route</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.min.js"></script>
<style>
:root{
  --bg:#f4ecd8; --panel:#fffaf0; --fg:#2a2419; --muted:#6b5e47; --rule:#d9c9a3;
  --accent:#8a3e2b; --path:#b5502f; --done:#5a5244; --accent-soft:#efdcc6; --field:#fbf6ea;
  font-family: ui-serif, Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141210; --panel:#1e1a15; --fg:#e8ddc5; --muted:#9c8c6e; --rule:#3a3225;
         --accent:#d88a6a; --path:#e8a07a; --done:#4a4238; --accent-soft:#3a2a1f; --field:#17130f; color-scheme:dark; }
}
html,body{margin:0; height:100%; background:var(--bg); color:var(--fg)}
body{display:flex; flex-direction:column}
.ui-font{font-family:ui-sans-serif, system-ui, "Segoe UI", sans-serif}
.topbar{background:var(--panel); border-bottom:1px solid var(--rule); padding:12px 18px 0; z-index:1000; font-family:ui-sans-serif, system-ui, "Segoe UI", sans-serif}
.topbar-head{display:flex; justify-content:space-between; align-items:flex-start; gap:18px; flex-wrap:wrap}
.titlewrap h1{font-family:"IM Fell English SC", ui-serif, Georgia, serif; font-weight:400; letter-spacing:.03em; font-size:24px; margin:0; line-height:1}
.titlewrap .sub{color:var(--muted); font-size:12px; margin-top:3px}
.summary{color:var(--muted); font-size:12.5px; text-align:right; font-variant-numeric:tabular-nums; line-height:1.55}
.summary b{color:var(--fg); font-weight:700}
.toolbar{display:flex; align-items:center; flex-wrap:wrap; row-gap:8px; margin-top:12px}
.grp{display:flex; align-items:center; gap:8px; padding:2px 14px}
.grp:first-child{padding-left:0}
.grp + .grp{border-left:1px solid var(--rule)}
.grp-label{color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.06em; font-weight:700}
.chk{display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; white-space:nowrap}
.hint{color:var(--muted); font-size:12px; max-width:240px}
.topbar input[type=number], .topbar input[type=text]{font:inherit; font-size:13px; padding:5px 8px; border:1px solid var(--rule); background:var(--field); color:var(--fg); border-radius:6px}
.topbar input[type=number]{width:50px}
.topbar input[type=text]{width:118px}
.topbar button{font:inherit; font-size:13px; padding:5px 12px; border:1px solid var(--rule); background:var(--field); color:var(--fg); border-radius:6px; cursor:pointer}
.topbar button:hover{border-color:var(--accent)}
.topbar .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff}
.topbar .btn-primary:hover{filter:brightness(1.08)}
.typebar{display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin-top:12px; padding:10px 0; border-top:1px solid var(--rule)}
.typechip{display:inline-flex; align-items:center; gap:6px; padding:4px 11px 4px 8px; border:1px solid var(--rule); border-radius:999px; font-size:12px; cursor:pointer; color:var(--muted); user-select:none}
.typechip img{width:16px; height:16px; image-rendering:pixelated; filter:grayscale(1) opacity(.45)}
.typechip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--fg)}
.typechip.on img{filter:none}
.typenotes{display:flex; gap:14px; margin-left:auto; color:var(--muted); font-size:12px; align-items:center}
.typenotes .dsh{display:inline-block; width:16px; border-top:2px dashed currentColor; margin-right:5px; vertical-align:middle}
#map{flex:1 1 auto; background:#576c9d}
/* guided tour (coach marks) */
.tour-hole{position:fixed; z-index:4000; border-radius:8px; box-shadow:0 0 0 9999px rgba(15,12,9,.64); outline:2px solid var(--accent); outline-offset:3px; pointer-events:none; transition:left .25s ease, top .25s ease, width .25s ease, height .25s ease}
.tour-hole.center{outline:none; box-shadow:0 0 0 9999px rgba(15,12,9,.64)}
.tour-pop{position:fixed; z-index:4001; width:290px; max-width:calc(100vw - 24px); background:var(--panel); color:var(--fg); border:1px solid var(--rule); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.45); padding:14px 16px; font-family:ui-sans-serif, system-ui, "Segoe UI", sans-serif}
.tour-pop h3{margin:0 0 5px; font-size:16px; font-family:"IM Fell English SC", ui-serif, Georgia, serif; font-weight:400}
.tour-pop p{margin:0 0 12px; font-size:13px; line-height:1.5}
.tour-pop em{font-style:normal; font-weight:600}
.tour-row{display:flex; align-items:center; justify-content:space-between; gap:10px}
.tour-step{color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}
.tour-btns{display:flex; gap:6px}
.tour-btns button{font:inherit; font-size:12.5px; padding:5px 11px; border-radius:6px; border:1px solid var(--rule); background:var(--field); color:var(--fg); cursor:pointer}
.tour-btns .next{background:var(--accent); border-color:var(--accent); color:#fff}
.tour-skip{background:none; border:none; color:var(--muted); font:inherit; font-size:12px; text-decoration:underline; cursor:pointer; padding:4px}
.tour-gate{margin:0 0 12px!important; font-size:12.5px; color:var(--accent); font-weight:600}
.tour-pop .muted{color:var(--muted); font-weight:400}
.taskicon{position:relative; background:#fffaf0; border:2px solid #000; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center}
.taskicon.done{background:#3aa655; border-color:#1e7a3a !important; opacity:.5}
.taskicon.done img{filter:grayscale(0.5)}
.taskicon img{width:80%; height:80%; image-rendering:pixelated}
.seqnum{position:absolute; top:-7px; right:-7px; min-width:15px; height:15px; padding:0 2px; box-sizing:border-box; background:#1b1b1b; color:#fff; border:1.5px solid #fff; border-radius:8px; font:700 10px/12px ui-sans-serif,system-ui,sans-serif; text-align:center; font-variant-numeric:tabular-nums}
.seqnum.iso{background:#8a6d3b; border-color:#fff}
.leaflet-container{font-family:inherit}
.unlockpanel{background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:8px 10px; box-shadow:0 1px 4px rgba(0,0,0,.3); font-size:13px; min-width:150px; max-width:72vw}
.unlockpanel .uptitle{font-weight:700; letter-spacing:.03em; margin-bottom:5px; text-transform:uppercase; font-size:11px; color:var(--muted); cursor:pointer; user-select:none}
.unlockpanel .uptitle::after{content:'▾'; float:right; margin-left:8px; opacity:.7}
.unlockpanel.collapsed .uptitle{margin-bottom:0}
.unlockpanel.collapsed .uptitle::after{content:'▸'}
.unlockpanel.collapsed > *:not(.uptitle){display:none}
.unlockpanel label{display:flex; gap:6px; align-items:center; cursor:pointer; padding:2px 0}
.unlockpanel .uphelp{font-weight:400; text-transform:none; letter-spacing:0; opacity:.7}
.unlockpanel .ghelp{margin-left:auto; width:14px; height:14px; border:1px solid var(--rule); border-radius:50%; font-size:9px; line-height:12px; text-align:center; color:var(--muted); cursor:help}
.ocrow{font-variant-numeric:tabular-nums}
.ocrow.off{opacity:.45}
.ocrow .sw{width:10px; height:10px; border-radius:50%; flex:none}
.ocrow .ocname{flex:1}
.ocrow .occount{opacity:.7; font-size:12px}
/* ---- mobile / narrow screens ---- */
@media (max-width:640px){
  .topbar{padding:8px 12px 0}
  .topbar-head{flex-direction:column; align-items:stretch; gap:2px}
  .titlewrap h1{font-size:19px}
  .titlewrap .sub{font-size:11px}
  .summary{text-align:left; font-size:11.5px; line-height:1.45}
  .toolbar{row-gap:7px}
  .grp{padding:0; gap:7px; flex-wrap:wrap}
  .grp + .grp{border-left:none; padding-left:0}
  .grp-label{font-size:9.5px}
  .topbar input[type=text]{width:130px}
  .topbar button{padding:6px 12px}  /* easier tap targets */
  .chk{font-size:13px}
  .typebar{gap:6px; padding:8px 0; margin-top:8px}
  .typenotes{margin-left:0; width:100%; flex-wrap:wrap; gap:6px 12px; margin-top:2px}
  .typechip{padding:5px 11px}
  .unlockpanel{min-width:0; max-width:56vw; font-size:12px; padding:6px 8px}
  .unlockpanel .ocrow, .unlockpanel label{padding:3px 0}  /* bigger tap rows */
  .leaflet-top.leaflet-right{max-width:60vw}
  .tour-pop{width:min(290px, calc(100vw - 20px))}
}
</style>
</head>

<script>
const {types, seas, oceans, tasks} = JSON.parse(document.getElementById('data').textContent);
const ICONS = JSON.parse(document.getElementById('icondata').textContent);
const GEAR = JSON.parse(document.getElementById('geardata').textContent);
const ICON_KEY = { GENERIC:'generic', SPYGLASS:'spyglass', CURRENT_DUCK:'current', DRINK_CRATE:'crate', MERMAID_GUIDE:'diving', WEATHER:'weather' };
const data = tasks.filter(t => t[4] < 7000);
const DIVING = types.indexOf('MERMAID_GUIDE'), WEATHER = types.indexOf('WEATHER'), DUCK = types.indexOf('CURRENT_DUCK');
let START = {x:3030, y:3197, name:'Port Sarim'};
let startPick = false; // when armed, the next task click sets the route start
// ocean palette (index matches data `oceans` order: ardent,sunset,unquiet,misc,western,shrouded,northern)
const OCEAN_COLORS = ['#d07b3a','#d8a21e','#3fa08c','#9b7bb5','#5f9440','#c24b86','#5b9bd5'];
const oceanOn = oceans.map(()=>true);
function oceanColor(oi){ return (oi>=0 && oi<OCEAN_COLORS.length) ? OCEAN_COLORS[oi] : '#888'; }

// task-id → gear labels
const taskGear = new Map();
for(const [label, def] of Object.entries(GEAR)){
  if(Array.isArray(def)){
    const s = new Set(def);
    for(const t of tasks) if(s.has(t[6])){ (taskGear.get(t[0]) || taskGear.set(t[0], new Set()).get(t[0])).add(label); }
  } else if(def.tasks){
    for(const id of def.tasks){ (taskGear.get(id) || taskGear.set(id, new Set()).get(id)).add(label); }
  }
}
// a task is hidden when any facility it requires is NOT unlocked (its box unchecked)
function gearBlocked(id){
  const r = taskGear.get(id); if(!r) return false;
  for(const g of r){ const cb = document.querySelector(`.gear[data-g="${g}"]`); if(!cb || !cb.checked) return true; }
  return false;
}

// completed set (seeded from Beebeelex's live WikiSync: tasks 0,1,11,28)
const DONE_KEY = 'beebeelex-done-v5';
const SEED = [0, 1, 11, 28];
let done = new Set();
try { const raw = localStorage.getItem(DONE_KEY); done = raw ? new Set(JSON.parse(raw)) : new Set(SEED); }
catch(_){ done = new Set(SEED); }
function saveDone(){ try{ localStorage.setItem(DONE_KEY, JSON.stringify([...done])); }catch(_){} }

// ---- Leaflet map on the wiki's real OSRS tiles ----
// Projection verified against maps.runescape.wiki: pixel = game*2^z, origin game(0,0), server Y is bottom-origin (TMS).
// toLatLng(x,y)=latLng(y,x) with default CRS.Simple → px=2^z*x, py=-2^z*y (east right, north up).
// Leaflet's tile row then comes out negative, so the server row = (-coords.y - 1).
// frame the sailing world from the task extent (+margin). Keeping tiles and panning inside the
// real map removes stray "chunked" tiles beyond it and stops far-ocean requests from sprawling.
const _xs=data.map(t=>t[3]), _ys=data.map(t=>t[4]);
const WORLD = L.latLngBounds(
  [Math.min(..._ys)-150, Math.min(..._xs)-150],
  [Math.max(..._ys)+150, Math.max(..._xs)+150]
);
const map = L.map('map', { crs: L.CRS.Simple, minZoom: -3, maxZoom: 7, zoomControl: true, attributionControl: false, maxBounds: WORLD.pad(0.08), maxBoundsViscosity: 0.7 });
// Current wiki tile set (has Varlamore, Sailing, etc). Same game-coord projection as before.
// To refresh later: bump TILE_VERSION to the newest from a wiki map page's tile URL.
const TILE_VERSION = '2026-08-12_a';
const RSTiles = L.TileLayer.extend({
  getTileUrl: function(c){ return `https://maps.runescape.wiki/osrs/versions/${TILE_VERSION}/tiles/rendered/0/${c.z}/0_${c.x}_${-c.y - 1}.png`; }
});
// native tiles exist z-3…3; Leaflet downscales beyond. Tiles only load within WORLD; outside and
// any un-rendered open ocean (404) falls back to a solid ocean-blue tile, never black.
const OCEAN_TILE = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGMIz5kLAAJ+AWFeJhQUAAAAAElFTkSuQmCC';
new RSTiles('', { minZoom:-3, maxZoom:7, maxNativeZoom:3, minNativeZoom:-3, noWrap:true, bounds: WORLD, errorTileUrl: OCEAN_TILE, keepBuffer:3 }).addTo(map);
function toLatLng(x, y){ return L.latLng(y, x); }

// "Unlocked" panel snapped to the map's right edge: check a facility you own and tasks that need it
// become routable. Unchecked = locked = hidden. Beebeelex starts with none.
// Oceans panel on the map's right edge (above Unlocked). Toggle an ocean to show/hide its tasks.
let oceansBox = null;
const OCEANS_CTL = L.control({position:'topright'});
OCEANS_CTL.onAdd = function(){
  const d = L.DomUtil.create('div','unlockpanel');
  d.id = 'oceansPanel';
  oceansBox = d;
  if(innerWidth<=640) d.classList.add('collapsed');   // start collapsed on phones
  L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
  return d;
};
OCEANS_CTL.addTo(map);

// what each boat-facility unlock is for (hover tooltips) — from the plugin's gear-requirement notes
const GEAR_DESC = {
  "Adamant keel+": "Crystal-flecked waters (Piscatoris Sea, Porth Gwenith, Porth Neigwl, Tirannwn Bight) and tangled kelp (Rainbow Reef, Southern Expanse) damage or slow your boat unless it has at least an adamant-tier keel/helm.",
  "Eternal brazier": "Icy seas (Everwinter, Idestia Strait, Kannski Tides, Lunar Sea, Shiverwake Expanse, Stoneheart Sea, V's Belt, Weiss Melt, Weissmere, Winter's Edge) freeze your crew and damage the ship without it. The schematic needs 76 Sailing.",
  "Inoculation station": "Fetid, disease-inducing waters (Backwater, Breakbone Strait, Mythic Sea, Sea of Souls, Zul-Egil) damage or slow the boat without it.",
  "Mast upgrade": "Stormy seas (Kharazi Strait, The Storm Tempor) hit you with lightning clouds. An Oak+ mast cuts the damage; Camphor/Ironwood/Rosewood masts prevent it entirely.",
  "Requires raft": "A couple of tasks sit in water only a small raft can reach (Grandroot Bay current duck, the Black Lobster sealed crate) — the big boat can't get there."
};
const UNLOCK_CTL = L.control({position:'topright'});
UNLOCK_CTL.onAdd = function(){
  const d = L.DomUtil.create('div','unlockpanel');
  d.id = 'unlockPanel';
  d.innerHTML = '<div class="uptitle">Unlocked <span class="uphelp">(hover for info)</span></div>' + Object.keys(GEAR).map(g =>
    `<label title="${(GEAR_DESC[g]||'').replace(/"/g,'&quot;')}"><input type="checkbox" class="gear" data-g="${g}"> ${g.replace('Requires raft','Raft')}<span class="ghelp">?</span></label>`
  ).join('');
  if(innerWidth<=640) d.classList.add('collapsed');   // start collapsed on phones
  d.querySelector('.uptitle').addEventListener('click', ()=> d.classList.toggle('collapsed'));
  L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
  return d;
};
UNLOCK_CTL.addTo(map);

// ---- water-only pathfinding over a navigability grid (1 bit/cell, 1 = sailable water) ----
const WM = JSON.parse(document.getElementById('watermask').textContent);
const WM_BITS = (()=>{ const b=atob(WM.bits); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a; })();
const GW=WM.gw, GH=WM.gh, CELL=WM.cell, WX0=WM.x0, WY0=WM.y0;
function cellIdx(cx,cy){ return cy*GW+cx; }
function inGrid(cx,cy){ return cx>=0&&cy>=0&&cx<GW&&cy<GH; }
function isWaterCell(cx,cy){ if(!inGrid(cx,cy)) return true; const i=cellIdx(cx,cy); return (WM_BITS[i>>3]>>(i&7))&1; } // off-grid = open ocean
function toCell(x,y){ return [Math.floor((x-WX0)/CELL), Math.floor((y-WY0)/CELL)]; }
function cellCenter(cx,cy){ return [WX0+cx*CELL+CELL/2, WY0+cy*CELL+CELL/2]; }
// nearest water cell to a game point (ring search); null if none within radius
const snapCache = new Map();
function snapWater(x,y){
  const key=x+','+y; if(snapCache.has(key)) return snapCache.get(key);
  let [cx,cy]=toCell(x,y); let res=null;
  if(isWaterCell(cx,cy)) res=[cx,cy];
  else for(let r=1;r<=16&&!res;r++){
    for(let dx=-r;dx<=r&&!res;dx++) for(let dy=-r;dy<=r&&!res;dy++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
      if(isWaterCell(cx+dx,cy+dy)){ res=[cx+dx,cy+dy]; }
    }
  }
  snapCache.set(key,res); return res;
}
// A* on the grid (8-dir, no corner-cutting). Reusable stamped arrays; node cap → null (caller draws straight).
const N=GW*GH, gScore=new Float32Array(N), seen=new Int32Array(N), came=new Int32Array(N);
let stamp=0;
const pathCache=new Map();
function astar(ax,ay,bx,by){
  const key=ax+','+ay+'>'+bx+','+by; if(pathCache.has(key)) return pathCache.get(key);
  const start=cellIdx(ax,ay), goal=cellIdx(bx,by);
  stamp++; const S=stamp;
  const heap=[]; // [f, idx]; simple binary min-heap
  const push=(f,i)=>{heap.push([f,i]); let c=heap.length-1; while(c>0){const p=(c-1)>>1; if(heap[p][0]<=heap[c][0])break; [heap[p],heap[c]]=[heap[c],heap[p]]; c=p;}};
  const pop=()=>{const top=heap[0], last=heap.pop(); if(heap.length){heap[0]=last; let c=0; for(;;){let l=2*c+1,r=l+1,s=c; if(l<heap.length&&heap[l][0]<heap[s][0])s=l; if(r<heap.length&&heap[r][0]<heap[s][0])s=r; if(s===c)break; [heap[s],heap[c]]=[heap[c],heap[s]]; c=s;}} return top;};
  const h=(i)=>{const x=i%GW,y=(i/GW)|0; return Math.hypot(x-bx,y-by);};
  gScore[start]=0; seen[start]=S; came[start]=-1; push(h(start),start);
  let pops=0; const CAP=200000;
  while(heap.length){
    const [,cur]=pop(); if(++pops>CAP) break;
    if(cur===goal){
      const pts=[]; let k=cur; while(k!==-1){ const x=k%GW,y=(k/GW)|0; pts.push(cellCenter(x,y)); k=came[k]; }
      pts.reverse(); const simp=simplify(pts); pathCache.set(key,simp); return simp;
    }
    const cx=cur%GW, cy=(cur/GW)|0, cg=gScore[cur];
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
      if(!dx&&!dy)continue; const nx=cx+dx, ny=cy+dy;
      if(!isWaterCell(nx,ny))continue;
      if(dx&&dy&&(!isWaterCell(cx+dx,cy)||!isWaterCell(cx,cy+dy)))continue; // no corner cut
      const ni=cellIdx(nx,ny), step=(dx&&dy)?1.4142:1, ng=cg+step;
      if(seen[ni]!==S||ng<gScore[ni]){ seen[ni]=S; gScore[ni]=ng; came[ni]=cur; push(ng+h(ni),ni); }
    }
  }
  pathCache.set(key,null); return null;
}
function simplify(pts){ // drop near-collinear points
  if(pts.length<3) return pts;
  const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){
    const a=out[out.length-1], b=pts[i], c=pts[i+1];
    const cross=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
    if(Math.abs(cross)>CELL*CELL*0.5) out.push(b);
  }
  out.push(pts[pts.length-1]); return out;
}
// clear water line-of-sight between two game points (sampled every ~half-cell)
function losWater(ax,ay,bx,by){
  const steps=Math.max(2, Math.ceil(Math.hypot(bx-ax,by-ay)/(CELL*0.5)));
  for(let i=1;i<steps;i++){ const x=ax+(bx-ax)*i/steps, y=ay+(by-ay)*i/steps; const c=toCell(x,y); if(!isWaterCell(c[0],c[1])) return false; }
  return true;
}
// string-pull: drop grid staircase points by connecting the farthest point still in clear water
function stringPull(pts){
  if(pts.length<=2) return pts;
  const out=[pts[0]]; let a=0;
  while(a<pts.length-1){
    let b=pts.length-1;
    while(b>a+1 && !losWater(pts[a][0],pts[a][1], pts[b][0],pts[b][1])) b--;
    out.push(pts[b]); a=b;
  }
  return out;
}
// Chaikin corner-cutting for gentle curves (endpoints fixed)
function chaikin(pts, iters){
  for(let k=0;k<iters && pts.length>2;k++){
    const out=[pts[0]];
    for(let i=0;i<pts.length-1;i++){
      const p=pts[i], q=pts[i+1];
      out.push([p[0]*0.75+q[0]*0.25, p[1]*0.75+q[1]*0.25]);
      out.push([p[0]*0.25+q[0]*0.75, p[1]*0.25+q[1]*0.75]);
    }
    out.push(pts[pts.length-1]); pts=out;
  }
  return pts;
}
// water route between two game points, smoothed, or null if not connected by navigable water.
function waterPath(ax,ay,bx,by){
  const sa=snapWater(ax,ay), sb=snapWater(bx,by);
  if(!sa||!sb) return null;
  const grid=astar(sa[0],sa[1],sb[0],sb[1]);
  if(!grid) return null;
  let path=[[ax,ay], ...grid, [bx,by]];
  path=stringPull(path);   // remove grid juts, stay in water
  path=chaikin(path, 2);   // round the remaining corners
  return path;
}

const lvl = document.getElementById('lvl');
const togPath = document.getElementById('togPath');
// per-type show/hide (checked = show). Diving & weather start hidden (her preference).
const typeOn = types.map(()=>true); typeOn[DIVING]=false; typeOn[WEATHER]=false;
const hideDone = document.getElementById('hideDone');
const summary = document.getElementById('summary');

const routeLayer = L.layerGroup().addTo(map);
const markerLayer = L.layerGroup().addTo(map);

// A duck is an atomic leg: you enter at its start and leave at its drift-end, so routing
// continues from the END (you don't backtrack and lose the duck). entry = start, exit = drift-end.
function entry(t){ return [t[3], t[4]]; }
// ducks AND weather tasks are two-point "drifts": enter at start, leave at the second point
function isDrift(t){ return (t[2]===DUCK || t[2]===WEATHER) && t[8]; }
function driftKind(t){ return t[2]===WEATHER ? 'weather' : 'duck'; }
function exitPt(t){ return isDrift(t) ? t[8] : [t[3], t[4]]; }
// distance from point to segment + projection parameter t along the segment (0=start,1=end)
function segProj(px,py, ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  const t = L2 ? ((px-ax)*dx+(py-ay)*dy)/L2 : 0;
  const tc=Math.max(0,Math.min(1,t)), qx=ax+tc*dx, qy=ay+tc*dy;
  return { d: Math.hypot(px-qx,py-qy), t };
}
// connected water bodies (8-dir flood fill) — a task whose water pocket can't be reached from the
// rest of its sea is "isolated": shown as a standalone "?" instead of breaking the numbered route.
const comp = new Int32Array(GW*GH); comp.fill(-1);
(function labelComponents(){
  let cid=0; const stack=[];
  for(let s=0;s<GW*GH;s++){
    if(comp[s]!==-1) continue;
    const sx=s%GW, sy=(s/GW)|0;
    if(!isWaterCell(sx,sy)) continue;
    comp[s]=cid; stack.length=0; stack.push(s);
    while(stack.length){
      const cur=stack.pop(), cx=cur%GW, cy=(cur/GW)|0;
      for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
        if(!dx&&!dy)continue; const nx=cx+dx, ny=cy+dy;
        if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
        const ni=ny*GW+nx;
        if(comp[ni]===-1 && isWaterCell(nx,ny)){ comp[ni]=cid; stack.push(ni); }
      }
    }
    cid++;
  }
})();
function taskComp(t){ const s=snapWater(t[3],t[4]); return s ? comp[s[1]*GW+s[0]] : -2; }
const CORRIDOR = 44; // game tiles: a task this close to a duck's drift is "on the way"
// cost of visiting tasks in `ord` from (sx,sy): enter each at its start, leave at its exit
function tourCost(ord, sx, sy){
  let d=0, cx=sx, cy=sy;
  for(const t of ord){ const e=entry(t); d+=Math.hypot(e[0]-cx,e[1]-cy); const x=exitPt(t); cx=x[0]; cy=x[1]; }
  return d;
}
function nnOrder(tasks, sx, sy){
  const left=tasks.slice(), out=[]; let cx=sx, cy=sy;
  while(left.length){
    let bi=0, bd=Infinity;
    for(let i=0;i<left.length;i++){ const e=entry(left[i]); const d=Math.hypot(e[0]-cx,e[1]-cy); if(d<bd){bd=d;bi=i;} }
    const t=left.splice(bi,1)[0]; out.push(t); const x=exitPt(t); cx=x[0]; cy=x[1];
  }
  return out;
}
// 2-opt local search: reverse sub-sequences to remove crossings/backtracks the greedy NN leaves
function twoOpt(ord, sx, sy){
  if(ord.length<4) return ord;
  let best=ord.slice(), bestC=tourCost(best,sx,sy), improved=true, guard=0; const n=best.length;
  while(improved && guard++<30){
    improved=false;
    for(let i=0;i<n-1;i++) for(let j=i+1;j<n;j++){
      const cand=best.slice(0,i).concat(best.slice(i,j+1).reverse(), best.slice(j+1));
      const c=tourCost(cand,sx,sy);
      if(c<bestC-1e-6){ best=cand; bestC=c; improved=true; }
    }
  }
  return best;
}
// Returns ordered legs: within each sea, order is nearest-neighbor then 2-opt-improved so there
// are no silly backtracks; ducks/weather expand into drift legs that pick up corridor tasks.
function buildRoute(pts){
  const bySea = new Map();
  for(const p of pts){ if(!bySea.has(p[6])) bySea.set(p[6], []); bySea.get(p[6]).push(p); }
  const legs = []; const order = new Map(); const isolated = new Set(); let seq = 0;
  let cx=START.x, cy=START.y; const rem=new Set(bySea.keys());
  while(rem.size){
    let bk=null, bd=Infinity;
    for(const k of rem) for(const p of bySea.get(k)){ const e=entry(p); const d=Math.hypot(e[0]-cx,e[1]-cy); if(d<bd){bd=d;bk=k;} }
    // split this sea's tasks by water body; route the biggest, flag the rest as isolated ("?")
    const groups = new Map();
    for(const t of bySea.get(bk)){ const c=taskComp(t); if(!groups.has(c)) groups.set(c,[]); groups.get(c).push(t); }
    let mainC=null, mainN=-1;
    for(const [c,arr] of groups){ if(arr.length>mainN){ mainN=arr.length; mainC=c; } }
    for(const [c,arr] of groups){ if(c!==mainC) for(const t of arr) isolated.add(t[0]); }
    const ord = twoOpt(nnOrder(groups.get(mainC), cx, cy), cx, cy);
    const absorbed = new Set();
    let first = true;
    for(let idx=0; idx<ord.length; idx++){
      const t=ord[idx]; if(absorbed.has(t[0])) continue;
      const oi=t[7], e=entry(t);
      legs.push({kind: first?'hop':'travel', ocean:oi, from:[cx,cy], to:e});
      first=false; order.set(t[0], ++seq);
      if(isDrift(t)){
        const s=e, en=t[8], dk=driftKind(t);
        // pull not-yet-visited non-drift tasks lying along the drift corridor, ordered start→end
        const cor=[];
        for(let k=idx+1;k<ord.length;k++){
          const q=ord[k]; if(absorbed.has(q[0]) || isDrift(q)) continue; const qe=entry(q);
          const r=segProj(qe[0],qe[1], s[0],s[1], en[0],en[1]);
          if(r.d<=CORRIDOR && r.t>0.02 && r.t<0.98){ cor.push({q, qe, t:r.t}); absorbed.add(q[0]); }
        }
        cor.sort((a,b)=>a.t-b.t);
        let px=s[0], py=s[1];
        for(const c of cor){ legs.push({kind:dk, ocean:oi, from:[px,py], to:c.qe}); px=c.qe[0]; py=c.qe[1]; order.set(c.q[0], ++seq); }
        legs.push({kind:dk, ocean:oi, from:[px,py], to:en});
        cx=en[0]; cy=en[1];
      } else {
        cx=e[0]; cy=e[1];
      }
    }
    rem.delete(bk);
  }
  return { legs, order, isolated };
}
function routeLen(legs){ let d=0; for(const l of legs) d+=Math.hypot(l.to[0]-l.from[0], l.to[1]-l.from[1]); return d; }
// parallel-offset a path (game coords) by `dist` tiles, tapering to 0 at both ends so the line
// still touches its markers exactly while the middle is offset for separation. Line and arrows
// share this geometry; offset side is set by the sign of dist.
function offsetPath(pts, dist){
  if(pts.length<3 || !dist) return pts;
  const cum=[0];
  for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  const total=cum[cum.length-1];
  if(total<1e-6) return pts;
  const RAMP=Math.min(14, total/2); // taper length near each end
  const nrm=[];
  for(let i=0;i<pts.length-1;i++){
    const dx=pts[i+1][0]-pts[i][0], dy=pts[i+1][1]-pts[i][1], len=Math.hypot(dx,dy)||1;
    nrm.push([-dy/len, dx/len]); // left-hand normal
  }
  const out=[];
  for(let i=0;i<pts.length;i++){
    let nx,ny;
    if(i===0){ [nx,ny]=nrm[0]; }
    else if(i===pts.length-1){ [nx,ny]=nrm[nrm.length-1]; }
    else { nx=nrm[i-1][0]+nrm[i][0]; ny=nrm[i-1][1]+nrm[i][1]; const l=Math.hypot(nx,ny)||1; nx/=l; ny/=l; }
    const fromEnd=Math.min(cum[i], total-cum[i]);
    const f = RAMP>0 ? Math.min(1, fromEnd/RAMP) : 0; // 0 at the ends, 1 in the middle
    out.push([pts[i][0]+nx*dist*f, pts[i][1]+ny*dist*f]);
  }
  return out;
}

const duckLayer = L.layerGroup().addTo(map);

let visible = [];
function render(){
  const L_ = Math.max(1, Math.min(99, +lvl.value || 1));
  // `shown` = everything drawn on the map; `visible` = the routable subset (completed tasks are
  // drawn green/faded but never routed). "Hide done" fully removes completed from the map.
  const shown = data.filter(t =>
    t[5] <= L_
    && typeOn[t[2]]
    && !gearBlocked(t[0])
    && (t[7] < 0 || oceanOn[t[7]])
    && !(hideDone.checked && done.has(t[0]))
  );
  visible = shown.filter(t => !done.has(t[0]));
  routeLayer.clearLayers();
  markerLayer.clearLayers();
  duckLayer.clearLayers();

  // single connected route over not-done tasks; duck legs (start→drift-end) are threaded in blue
  let legs = [], order = new Map(), isolated = new Set();
  if(togPath.checked){
    const r = buildRoute(visible); legs = r.legs; order = r.order; isolated = r.isolated;
    for(const l of legs){
      const isDrift = l.kind === 'duck' || l.kind === 'weather';
      const driftCol = l.kind === 'weather' ? '#9b5cf6' : '#12d0e0'; // weather=violet, duck=cyan
      const col = isDrift ? driftCol : oceanColor(l.ocean);
      const raw = waterPath(l.from[0],l.from[1], l.to[0],l.to[1]);
      if(!raw){
        // no navigable water route (separate/enclosed seas): faint grey "relocate" hairline,
        // never a bold line implying you sail across land
        L.polyline([toLatLng(l.from[0],l.from[1]), toLatLng(l.to[0],l.to[1])], {
          color:'#9a9a9a', weight:1.5, opacity:0.5, dashArray:'2 7'
        }).addTo(routeLayer).bindTooltip('relocate (no direct water route)', {sticky:true});
        continue;
      }
      // offset the geometry itself so the line AND its arrows stay together. Drifts go to the
      // opposite side from travel/hop legs, so a drift overlapping a travel line never stacks.
      const pathPts = offsetPath(raw, isDrift ? -5 : 5);
      const latlngs = pathPts.map(p=>toLatLng(p[0],p[1]));
      const line = L.polyline(latlngs, {
        color: col, weight: isDrift?2.5:3.5,
        opacity: l.kind==='hop'?0.55:0.92,
        dashArray: l.kind==='hop' ? '10 8' : (isDrift ? '4 6' : null)
      }).addTo(routeLayer);
      if(L.polylineDecorator){
        L.polylineDecorator(line, { patterns:[
          { offset: '12%', repeat: 75, symbol: L.Symbol.arrowHead({ pixelSize: isDrift?8:10, polygon:true, pathOptions:{ color:col, fillOpacity:0.95, weight:0 } }) }
        ]}).addTo(routeLayer);
      }
      if(isDrift){
        L.circleMarker(latlngs[latlngs.length-1], { radius:4, color:driftCol, weight:2, fill:true, fillColor:'#fff', fillOpacity:0.85 }).addTo(duckLayer)
          .bindTooltip(l.kind==='weather'?'weather station moves to here':'duck drifts to here', {direction:'top'});
      }
    }
  }

  // start marker
  L.circleMarker(toLatLng(START.x, START.y), { radius:8, color:getCSS('--accent'), weight:3, fill:false }).addTo(markerLayer)
    .bindTooltip('Port Sarim (start)', {direction:'top'});

  // task markers: not-done get an ocean ring + sequence number; done stay on the map green/faded, no number
  for(const p of shown){
    const isDone = done.has(p[0]);
    const key = ICON_KEY[types[p[2]]];
    const ring = oceanColor(p[7]);
    const n = isDone ? null : order.get(p[0]);
    const iso = !isDone && !n && isolated.has(p[0]);   // reachable-by-water check failed → "?"
    const badge = n ? `<span class="seqnum">${n}</span>` : (iso ? `<span class="seqnum iso" title="No water route found to this task">?</span>` : '');
    const icon = L.divIcon({
      className: '', iconSize:[30,30], iconAnchor:[15,15],
      html: `<div class="taskicon${isDone?' done':''}" style="width:30px;height:30px;border-color:${isDone?'#1e7a3a':ring}"><img src="${ICONS[key]}" alt="">${badge}</div>`
    });
    const m = L.marker(toLatLng(p[3], p[4]), {icon}).addTo(markerLayer);
    const ocName = (p[7]>=0 ? oceans[p[7]][1] : '?');
    m.bindTooltip(`${p[1]} · ${ocName} › ${seas[p[6]]||'?'} · ${types[p[2]].toLowerCase().replace('_',' ')} · lvl ${p[5]} · (${p[3]}, ${p[4]})${isDone?' · ✓done':''}`, {direction:'top'});
    m.on('click', () => {
      if(startPick){ START = {x:p[3], y:p[4], name:p[1]}; startPick=false; updateStartUI(); render(); return; }
      if(done.has(p[0])) done.delete(p[0]); else done.add(p[0]); saveDone(); render();
    });
  }

  // xp estimate using each ocean's real avg xp/task (from wiki totals). Within-ocean it varies by task level, so this is approximate.
  let estXp = 0;
  for(const p of visible) estXp += (p[7]>=0 ? oceans[p[7]][6] : 230);
  estXp = Math.round(estXp);
  const needed = 101333 - 66004;
  summary.innerHTML = `<b>${done.size}</b> done · <b>${visible.length}</b> on route`
    + `<br>~<b>${estXp.toLocaleString()}</b> xp shown · need <b>${needed.toLocaleString()}</b> for lvl 50`
    + (togPath.checked ? `<br><span style="opacity:.8">≈ ${Math.round(routeLen(legs)).toLocaleString()} tiles of sailing</span>` : '');
  renderOceanChips(L_);
}
function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#b5502f'; }

// Oceans panel (right side): color swatch, name, toggle, and (done/accessible) count + xp/task

const wsUser = document.getElementById('wsUser'), wsStatus = document.getElementById('wsStatus');
const subEl = document.querySelector('.titlewrap .sub');
function applySync(j, uname){
  const ids = Array.isArray(j) ? j : (j && j.sea_charting) || null;
  if(!ids) { wsStatus.textContent = 'No sea charting data for that name.'; return false; }
  done = new Set(ids); saveDone();
  const lv = j && j.levels;
  const sail = lv && lv.Sailing;
  if(sail) lvl.value = sail;                       // auto-fill their Sailing level
  const name = (j && j.username) || uname || 'player';
  const total = lv ? Object.values(lv).reduce((a,b)=>a+(+b||0),0) : null;
  render();
  wsStatus.innerHTML = `✓ <b>${name}</b>${sail?` · Sailing <b>${sail}</b>`:''} · ${done.size} charts done`;
  subEl.textContent = `${name}${sail?` · Sailing ${sail}`:''}${total?` · total level ${total.toLocaleString()}`:''}`;
  return true;
}
async function fetchSync(u){
  // same-origin proxy: /api/wikisync on Vercel, /wikisync when run locally via sail.py
  for(const base of ['/api/wikisync?u=', '/wikisync?u=']){
    try { const r = await fetch(base+encodeURIComponent(u)); if(r.ok){ const j = await r.json(); if(!j.error) return j; } } catch(_){}
  }
  // last resort: direct (only works from an allowed *.runescape.wiki origin)
  try { const r = await fetch(`https://sync.runescape.wiki/runelite/player/${encodeURIComponent(u)}/STANDARD`); if(r.ok) return await r.json(); } catch(_){}
  return null;
}
async function doLookup(){
  const u = wsUser.value.trim();
  if(!u){ wsStatus.textContent = 'Enter a name first.'; return; }
  wsStatus.textContent = `Looking up ${u}…`;
  const j = await fetchSync(u);
  if(j && (Array.isArray(j)?j:j.sea_charting)) applySync(j, u);
  else wsStatus.innerHTML = `No data for <b>${u}</b>. The account must have uploaded via the RuneLite <b>WikiSync</b> plugin first (open RuneLite while logged in with WikiSync enabled).`;
  if(typeof tourAwaitLookup!=='undefined' && tourAwaitLookup){ tourAwaitLookup=false; advanceTour(); }  // tour gate: proceed once they've looked up
}

let tourHole=null, tourPop=null, tourIdx=0, tourAwaitLookup=false;
function endTour(){
  if(tourHole){ tourHole.remove(); tourHole=null; }
  if(tourPop){ tourPop.remove(); tourPop=null; }
  tourAwaitLookup=false;
  window.removeEventListener('resize', positionTour);

function positionTour(){
  if(!tourPop) return;
  const step=TOUR[tourIdx];
  const el=document.querySelector(step.sel);
  const r = el ? el.getBoundingClientRect() : {left:innerWidth/2, top:innerHeight/2, width:0, height:0};
  const pad = step.pad!=null ? step.pad : 8;
  if(step.center || !el){
    tourHole.className='tour-hole center';
    tourHole.style.left=(innerWidth/2-1)+'px'; tourHole.style.top=(innerHeight/2-1)+'px';
    tourHole.style.width='2px'; tourHole.style.height='2px';
  } else {
    tourHole.className='tour-hole';
    tourHole.style.left=(r.left-pad)+'px'; tourHole.style.top=(r.top-pad)+'px';
    tourHole.style.width=(r.width+pad*2)+'px'; tourHole.style.height=(r.height+pad*2)+'px';
  }
  // place the popover: left of left-side targets, else below, flipping above if no room
  const pw=tourPop.offsetWidth||290, ph=tourPop.offsetHeight||150, gap=14;
  let x, y;
  if(step.center || !el){ x=(innerWidth-pw)/2; y=(innerHeight-ph)/2; }
  else if(step.side==='left'){ x=r.left-pw-gap; y=r.top; if(x<10) x=r.right+gap; }
  else { x=r.left; y=r.bottom+gap; if(y+ph>innerHeight-10) y=r.top-ph-gap; }
  x=Math.max(10, Math.min(x, innerWidth-pw-10));
  y=Math.max(10, Math.min(y, innerHeight-ph-10));
  tourPop.style.left=x+'px'; tourPop.style.top=y+'px';
}
function advanceTour(){ if(!tourPop) return; if(tourIdx>=TOUR.length-1){ endTour(); } else { tourIdx++; renderTourStep(); positionTour(); } }
function renderTourStep(){
  const step=TOUR[tourIdx], last=tourIdx===TOUR.length-1, gated=step.gate==='lookup';
  tourAwaitLookup = gated;   // this step only advances once they actually look up
  tourPop.innerHTML =
    `<h3>${step.title}</h3><p>${step.html}</p>`+
    (gated?`<p class="tour-gate">↑ Enter your name and press <b>Look up</b> to continue.</p>`:``)+
    `<div class="tour-row"><span class="tour-step">${tourIdx+1} / ${TOUR.length}</span>`+
    `<div class="tour-btns">`+
      `<button class="tour-skip">Skip tour</button>`+
      (tourIdx>0?`<button class="back">Back</button>`:``)+
      (gated?``:`<button class="next">${last?'Done':'Next'}</button>`)+
    `</div></div>`;
  const next=tourPop.querySelector('.next'); if(next) next.onclick=advanceTour;
  const back=tourPop.querySelector('.back'); if(back) back.onclick=()=>{ tourIdx--; renderTourStep(); positionTour(); };
  tourPop.querySelector('.tour-skip').onclick=endTour;
  positionTour();
}
function startTour(){
  endTour();
  tourIdx=0;
  tourHole=document.createElement('div'); tourHole.className='tour-hole';
  tourPop=document.createElement('div'); tourPop.className='tour-pop';
  document.body.appendChild(tourHole); document.body.appendChild(tourPop);
  window.addEventListener('resize', positionTour);
  renderTourStep();
}
document.getElementById('helpBtn').addEventListener('click', startTour);
document.addEventListener('keydown', e => { if(e.key==='Escape' && tourPop) endTour(); });
let seenTour=false; try{ seenTour=!!localStorage.getItem('seen-tour-v1'); }catch(_){}
if(!seenTour) setTimeout(startTour, 500);
</script>
